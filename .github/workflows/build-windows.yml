# =============================================================================
# MovieHub · Windows 便携版 / 安装包云端构建（零本地环境）
# =============================================================================
#
# 为什么需要这个工作流
# -----------------------------------------------------------------------------
# 与 iOS 工作流同样的前提：开发者本地**不安装 Flutter SDK**。
# 而 `flutter build windows` 必须有 Flutter —— 所以本地既出不了 iOS 包，
# 也出不了 Windows 包。两边都搬到云端。
#
# 与 iOS 工作流的共同点：仓库里没有 windows/ 平台目录，需要在云端生成。
# 生成策略同样是「临时目录生成 → 只把 windows/ 拷回来」——理由见 build-ios.yml
# 开头的说明（对仓库零副作用、行为不随 Flutter 版本漂移）。
#
# 关于安装包（Inno Setup）
# -----------------------------------------------------------------------------
# windows-latest 镜像**不预装** Inno Setup。手动触发时把 build-installer 设为
# true，工作流会用 Chocolatey 现装一个（约 1 分钟）再出安装包。
# 默认关闭：大多数人只需要解压即用的便携版 zip。
#
# =============================================================================

name: Build Windows (Portable)

run-name: Windows 便携版 · ${{ github.ref_name }}

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      flutter-version:
        description: 'Flutter SDK 版本'
        required: false
        default: '3.24.5'
        type: string
      build-installer:
        description: '同时生成 Inno Setup 安装包（会用 Chocolatey 现装 Inno Setup，多约 1 分钟）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ inputs.flutter-version || '3.24.5' }}

jobs:
  build-windows:
    name: 构建便携版

    # ⚠️ 必须钉 windows-2022，不能写 windows-latest。
    # -----------------------------------------------------------------------
    # windows-latest 自 2026-06-15 起已经切到「Windows Server 2025 + Visual
    # Studio 2026 (18.5)」。而 Flutter 3.24.5 的
    # packages/flutter_tools/lib/src/windows/visual_studio.dart 里，
    # VS 大版本 → CMake 生成器的映射**只认 17**：
    #
    #     String? get cmakeGenerator {
    #       return switch (_majorVersion) {
    #         17 => 'Visual Studio 17 2022',
    #         _  => 'Visual Studio 16 2019',   // ← VS 18 落在这里
    #       };
    #     }
    #
    # 于是 VS 2026 会被算成 'Visual Studio 16 2019'，CMake 报：
    #     Generator Visual Studio 16 2019 could not find any instance of Visual Studio.
    #
    # 两个容易踩空的点：
    #   1. 设 CMAKE_GENERATOR 环境变量**没有用**。Flutter 在 build_windows.dart
    #      里是显式 `'-G', generator` 传给 cmake 的，会覆盖该环境变量；
    #      Flutter 官方 issue #180481 也明确写了 CMAKE_GENERATOR / VSWHERE_ARGS /
    #      PATH 覆盖都拦不住它。
    #   2. 在镜像上再装一个 VS 2022 也**没有用**。Flutter 只挑"最新"的那个，
    #      有 VS 2026 时一定选 VS 2026（同上 issue #180481）。
    #
    # 所以只能换镜像。GitHub 官方给出的规避方式就是这一句：
    #     "To continue using Visual Studio 2022, you can use the Windows-2022 Image."
    # windows-2022 带的是 VS 2022 (17.14)，正好映射到 'Visual Studio 17 2022'。
    #
    # 退出条件：等 Flutter 升到 3.39.0+（已加入 VS 18 映射）后，可以改回
    # windows-latest；在那之前别动这一行。
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: 打印工具链版本
        shell: pwsh
        run: |
          flutter --version
          Write-Host "── PowerShell ──"
          $PSVersionTable.PSVersion

          # 把 vswhere 看到的 Visual Studio 实例打出来。
          # Flutter 的 Windows 构建会把 VS 大版本号映射成 CMake 生成器
          # （17 → 'Visual Studio 17 2022'，其余一律落到 'Visual Studio 16 2019'），
          # 所以「VS 大版本是几」直接决定编译能不能起来。将来镜像再漂移时，
          # 有了这段日志就不必再从 CMake 的报错反推。
          Write-Host "── Visual Studio（vswhere）──"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host "vswhere: $vswhere"
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property displayName
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          } else {
            Write-Host "vswhere.exe 未找到（$vswhere）"
          }

      - name: 读取应用版本号
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $v = if ($line) { ($line.Matches[0].Groups[1].Value -split '\+')[0].Trim() } else { '0.0.0' }
          # 显式用「无 BOM 的 UTF-8」追加写 $GITHUB_OUTPUT。
          # 不能用 `Out-File -Encoding utf8`：Windows PowerShell 5.1 会写出 BOM，
          # 而 GitHub 解析这个文件时 BOM 会粘在第一个键名上，导致
          # steps.version.outputs.version 取不到值（而且不报错，只是空字符串）。
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`n", $utf8NoBom)
          Write-Host "应用版本：$v"

      # ── 关键步骤 ①：按需生成 windows/ 平台脚手架 ──────────────────────────
      - name: 生成 windows/ 平台脚手架（缺失时）
        shell: pwsh
        run: |
          if ((Test-Path 'windows\CMakeLists.txt') -and (Test-Path 'windows\runner\main.cpp')) {
            Write-Host "✔ 仓库里已有 windows/ 工程，跳过生成"
            exit 0
          }

          Write-Host "仓库里没有 windows/ 工程 —— 在临时目录生成后只拷贝 windows/ 回来"
          $scaffold = Join-Path $env:RUNNER_TEMP 'movie_hub_scaffold'
          if (Test-Path $scaffold) { Remove-Item $scaffold -Recurse -Force }

          # --no-pub：临时工程不需要跑 pub get
          flutter create --platforms=windows --project-name movie_hub --no-pub $scaffold
          if ($LASTEXITCODE -ne 0) { throw "flutter create 失败（退出码 $LASTEXITCODE）" }

          if (Test-Path 'windows') { Remove-Item 'windows' -Recurse -Force }
          Copy-Item -Path (Join-Path $scaffold 'windows') -Destination 'windows' -Recurse -Force

          Write-Host "✔ 已生成 windows/ ："
          Get-ChildItem windows -Recurse -Depth 1 | Select-Object -First 30 FullName

      - name: flutter pub get
        run: flutter pub get

      - name: 静态分析（仅告警）
        continue-on-error: true
        run: flutter analyze

      - name: 安装 Inno Setup（可选）
        if: inputs.build-installer == true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 安装失败" }

      # ── 关键步骤 ②：编译 + 打包 ───────────────────────────────────────────
      # 直接复用仓库里的打包脚本，云端与本地走的是**同一条代码路径**。
      # 它内部会做产物完整性校验（缺 libmpv*.dll 直接报错），而不是产出一个坏包。
      - name: 打包（flutter build windows + 便携版 zip）
        shell: pwsh
        run: |
          if ('${{ inputs.build-installer }}' -eq 'true') {
            & .\tool\package_windows.ps1 -Installer
          } else {
            & .\tool\package_windows.ps1
          }
          if ($LASTEXITCODE -ne 0) { throw "打包失败（退出码 $LASTEXITCODE）" }

      - name: 列出产物
        shell: pwsh
        run: |
          if (Test-Path dist) { Get-ChildItem dist | Format-Table Name, Length } else { throw "dist/ 不存在，打包未产出" }

      - name: 上传便携版 zip
        uses: actions/upload-artifact@v4
        with:
          name: movie_hub-windows-x64-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*setup*.exe
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: movie_hub-windows-x64-*
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      # release 标签相同的情况下，两个工作流会往同一个 Release 追加附件
      # （iOS 加 .ipa，Windows 加 .zip）。action-gh-release 会复用已存在的
      # Release 而不是报错，因此可以安全并行。
      - name: 创建/更新 Release 并附加产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
